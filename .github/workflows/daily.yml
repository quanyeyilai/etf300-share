name: 每日更新ETF份额数据

on:
  schedule:
    # 时间为 UTC；北京 = UTC+8
    - cron: '30 0 * * 1-5'   # 北京 08:30，抓取上一交易日定稿数据
    - cron: '0 11 * * 1-5'   # 北京 19:00，抓取当日盘后数据
  workflow_dispatch:
    inputs:
      days:
        description: '回填天数（0 = 仅增量）'
        required: false
        default: '0'
      only:
        description: '只抓某个交易所（留空 = 全部）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 原始抓取存档不入库（避免明文数据出现在仓库里），云端用缓存做增量
      - name: 恢复抓取存档
        uses: actions/cache@v4
        with:
          path: |
            data/etf_shares.csv
            data/macro.csv
            data/etf_market.csv
            data/notify_codes.txt
          key: etf-archive-v1

      - name: 抓取最新份额数据
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.days }}" ] && [ "${{ github.event.inputs.days }}" != "0" ]; then
            ARGS="$ARGS --days ${{ github.event.inputs.days }}"
          fi
          if [ -n "${{ github.event.inputs.only }}" ]; then
            ARGS="$ARGS --only ${{ github.event.inputs.only }}"
          fi
          echo "运行：python update.py $ARGS"
          python update.py $ARGS

      - name: 抓取板块估值榜
        continue-on-error: true
        run: python sector.py

      - name: 加密打包数据
        # 未配置 Secret ETF_USERS 时跳过（此时页面上仍是用本地打包的旧密文）
        continue-on-error: true
        env:
          ETF_USERS: ${{ secrets.ETF_USERS }}
        run: node protect.js

      # 只在盘后那次（UTC 11:00 = 北京 19:00）与手动触发时推送，避免一天两条
      - name: 微信推送每日速报
        if: github.event_name != 'schedule' || github.event.schedule == '0 11 * * 1-5'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        continue-on-error: true
        run: python notify.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): update ETF share $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
